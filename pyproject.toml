[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "acarla"
version = "0.1.0"
description = "Alpamayo-1.5 as the planner of a CARLA 0.9.16 ego vehicle: calibrated rig transfer, remote NF4 inference on Kaggle T4s, slow-motion closed loop with counted safety interventions."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["autonomous-driving", "carla", "vision-language-action", "alpamayo", "closed-loop", "simulation"]
classifiers = [
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy",
    "scipy",
    "pillow",
]

[project.urls]
Repository = "https://github.com/Say43/Autonomous-Driving-Stack"

[project.optional-dependencies]
sim = [
    "carla==0.9.16",
    "pyyaml",
    "huggingface_hub>=0.30",
]
model = [
    "accelerate>=1.12.0",
    "av>=16.0.1",
    "einops>=0.8.1",
    "hydra-colorlog>=1.2.0",
    "hydra-core>=1.3.2",
    "pandas>=2.3.3",
    "physical-ai-av==0.2.0; python_version >= '3.11'",
    "pillow>=12.0.0",
    "torch==2.8.0",
    "torchvision>=0.23.0",
    "transformers==4.57.1",
]
quantization = [
    "bitsandbytes",
]
dev = [
    "pytest",
    "ruff",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
extend-exclude = ["notebooks/*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
